[project]
name = "lectern"
version = "0.1.0"
description = "Lectern backend: AI presentation tool that exports editable PowerPoint files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "python-pptx>=1.0.2",
    "anthropic>=0.60",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "mcp>=1.12",
    "reportlab>=5.1.0",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.33",
]

[project.scripts]
lectern-mcp = "lectern.mcp:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lectern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
